<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Как провести свидание?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 30px auto;
        }
        .option {
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .option:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <h1>Как бы ты хотела провести свидание?</h1>
    <div class="options">
        <div class="option" data-activity="Прогуляться в парке и городе">Прогуляться в парке и городе</div>
        <div class="option" data-activity="Сходить в кино">Сходить в кино</div>
    </div>

    <script>
        document.querySelectorAll('.option').forEach(option => {
            option.addEventListener('click', function() {
                const activity = this.getAttribute('data-activity');
                localStorage.setItem('activity', activity);
                window.location.href = 'page3.html';
            });
        });
    </script>
</body>
</html>
