<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приглашение на свидание</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #d46a7e; font-size: 2.5em; margin-bottom: 50px; }
        .buttons { margin-top: 50px; }
        button {
            padding: 15px 30px;
            margin: 0 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #yesBtn { background: #4CAF50; color: white; }
        #noBtn { background: #f44336; color: white; position: relative; }
    </style>
</head>
<body>
    <h1>Хочешь пойти со мной на свидание?</h1>
    <div class="buttons">
        <button id="yesBtn">Да</button>
        <button id="noBtn">Нет</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        noBtn.addEventListener('mouseover', function(e) {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.position = 'absolute';
        });

        yesBtn.addEventListener('click', function() {
            localStorage.setItem('dateAccepted', 'Да');
            window.location.href = 'page2.html';
        });
    </script>
</body>
</html>
