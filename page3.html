<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбери дату и время</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .datetime {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
        }
        button {
            background: #6a11cb;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Выбери удобное время</h1>
    <div class="datetime">
        <label>Дата:</label>
        <input type="date" id="date">
        <label>Время:</label>
        <input type="time" id="time">
        <button id="nextBtn">Далее</button>
    </div>

    <script>
        document.getElementById('nextBtn').addEventListener('click', function() {
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            if (date && time) {
                localStorage.setItem('date', date);
                localStorage.setItem('time', time);
                window.location.href = 'page4.html';
            } else {
                alert('Пожалуйста, выберите дату и время');
            }
        });
    </script>
</body>
</html>
